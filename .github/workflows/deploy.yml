name: Deploy to Sakura

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - run: git config --global core.quotepath false
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx astro build

      - name: Normalize filenames to NFC
        run: |
          python3 <<'PY'
          import os, unicodedata
          for root, dirs, files in os.walk('./dist', topdown=False):
              for name in files + dirs:
                  nfc = unicodedata.normalize('NFC', name)
                  if nfc != name:
                      src = os.path.join(root, name)
                      dst = os.path.join(root, nfc)
                      os.rename(src, dst)
                      print(f'renamed: {src} -> {dst}')
          PY

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H arimuri.sakura.ne.jp >> ~/.ssh/known_hosts

      - name: Deploy main site
        run: rsync -avz --delete --exclude='/c4p/' --exclude='/otoviva/' --exclude='/kammerkonzert/' ./dist/ arimuri@arimuri.sakura.ne.jp:/home/arimuri/www/

      - name: Deploy c4p subdomain
        run: rsync -avz --delete ./c4p-site/ arimuri@arimuri.sakura.ne.jp:/home/arimuri/www/c4p/
