<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>fabcafe sampler — in the blue shirt</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<style>
	:root {
		--accent: #0078c8;
		--accent-dark: #005a96;
		--pop-pink: #f06595;
		--text: #1a1a2e;
		--text-light: #6b7280;
		--bg: #ffffff;
		--bg-soft: #f8f9fc;
		--border: #e5e7eb;
		--radius: 12px;
		--radius-lg: 20px;
		--shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
	}
	* { box-sizing: border-box; margin: 0; padding: 0; }
	body {
		font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
		background: var(--bg-soft);
		color: var(--text);
		min-height: 100dvh;
		display: flex;
		align-items: center;
		justify-content: center;
		padding: 24px;
	}
	.player {
		background: var(--bg);
		border: 1px solid var(--border);
		border-radius: var(--radius-lg);
		box-shadow: var(--shadow-md);
		padding: 40px 32px;
		width: 100%;
		max-width: 420px;
		text-align: center;
	}
	h1 {
		font-size: 1.2rem;
		letter-spacing: 0.02em;
		margin-bottom: 4px;
	}
	.sub {
		color: var(--text-light);
		font-size: 0.8rem;
		margin-bottom: 28px;
	}
	.group-caption {
		font-size: 0.72rem;
		color: var(--text-light);
		letter-spacing: 0.06em;
		margin-bottom: 8px;
	}
	.lengths {
		display: flex;
		justify-content: center;
		gap: 12px;
		margin-bottom: 20px;
	}
	.lengths label {
		display: flex;
		align-items: center;
		gap: 6px;
		padding: 8px 14px;
		border: 1.5px solid var(--border);
		border-radius: 999px;
		cursor: pointer;
		font-size: 0.9rem;
		user-select: none;
		transition: border-color 0.15s, background 0.15s;
	}
	.lengths label:has(input:checked) {
		border-color: var(--accent);
		background: #eaf4fb;
		color: var(--accent-dark);
	}
	.lengths input {
		accent-color: var(--accent);
		width: 15px;
		height: 15px;
	}
	.grid-select {
		display: flex;
		justify-content: center;
		gap: 12px;
		margin-bottom: 28px;
	}
	.grid-select label {
		display: flex;
		align-items: center;
		gap: 6px;
		padding: 8px 14px;
		border: 1.5px solid var(--border);
		border-radius: 999px;
		cursor: pointer;
		font-size: 0.9rem;
		user-select: none;
		transition: border-color 0.15s, background 0.15s;
	}
	.grid-select label:has(input:checked) {
		border-color: var(--pop-pink);
		background: #fdeef4;
		color: #c4356e;
	}
	.grid-select input {
		accent-color: var(--pop-pink);
		width: 15px;
		height: 15px;
	}
	.buttons {
		display: flex;
		justify-content: center;
		gap: 14px;
		margin-bottom: 24px;
	}
	button {
		font-family: inherit;
		font-size: 1rem;
		font-weight: 700;
		padding: 13px 36px;
		border: none;
		border-radius: 999px;
		cursor: pointer;
		transition: transform 0.1s, opacity 0.15s;
	}
	button:active { transform: scale(0.97); }
	#playBtn {
		background: var(--accent);
		color: #fff;
	}
	#playBtn:hover { background: var(--accent-dark); }
	#stopBtn {
		background: var(--bg);
		color: var(--text);
		border: 1.5px solid var(--border);
	}
	#stopBtn:hover { border-color: var(--text-light); }
	button:disabled {
		opacity: 0.4;
		cursor: default;
		transform: none;
	}
	.now {
		font-size: 0.85rem;
		color: var(--text-light);
		min-height: 1.4em;
	}
	.now .dot {
		display: inline-block;
		width: 8px;
		height: 8px;
		border-radius: 50%;
		background: var(--pop-pink);
		margin-right: 7px;
		animation: pulse 1s infinite alternate;
	}
	@keyframes pulse {
		from { opacity: 1; }
		to { opacity: 0.25; }
	}
</style>
</head>
<body>
	<main class="player">
		<h1>fabcafe sampler</h1>
		<p class="sub">in the blue shirt</p>

		<p class="group-caption">使うサンプル</p>
		<div class="lengths">
			<label><input type="checkbox" value="6" checked />6sec</label>
			<label><input type="checkbox" value="15" checked />15sec</label>
			<label><input type="checkbox" value="30" checked />30sec</label>
		</div>

		<p class="group-caption">切替の単位</p>
		<div class="grid-select">
			<label><input type="radio" name="grid" value="15" />15sec単位</label>
			<label><input type="radio" name="grid" value="30" checked />30sec単位</label>
		</div>

		<div class="buttons">
			<button id="playBtn">再生</button>
			<button id="stopBtn" disabled>停止</button>
		</div>

		<p class="now" id="now"></p>
	</main>

<script>
	const FILES = {
		6:  ['audio/6sec_1.m4a', 'audio/6sec_2.m4a', 'audio/6sec_3.m4a', 'audio/6sec_4.m4a'],
		15: ['audio/15sec_1.m4a', 'audio/15sec_2.m4a', 'audio/15sec_3.m4a'],
		30: ['audio/30sec_1.m4a', 'audio/30sec_2.m4a', 'audio/30sec_3.m4a'],
	};
	const ALL = Object.values(FILES).flat();

	const playBtn = document.getElementById('playBtn');
	const stopBtn = document.getElementById('stopBtn');
	const nowEl = document.getElementById('now');
	const checks = [...document.querySelectorAll('.lengths input')];
	const grids = [...document.querySelectorAll('input[name="grid"]')];

	// 切替の単位(15 or 30秒)。1枠=1サンプルで、短ければループで埋め、長ければ境界でカット
	function grid() {
		return Number(grids.find(g => g.checked).value);
	}

	// ページ表示時に音源のダウンロードだけ先行させる(デコードは初回再生時)
	const fetched = new Map(ALL.map(src => [src, fetch(src).then(r => r.arrayBuffer())]));

	let ctx = null;
	const buffers = new Map(); // src -> {buffer, offset, duration}(無音トリム済み)
	let playing = false;
	let lastSrc = null;
	let current = null; // {source, src, when, endTime}
	let pending = null; // 次に鳴らす予約済みソース

	// AACのエンコーダパディング等による先頭/末尾の無音を除いた範囲を求める
	function trim(buffer) {
		const TH = 0.0005;
		let start = buffer.length, end = 0;
		for (let ch = 0; ch < buffer.numberOfChannels; ch++) {
			const d = buffer.getChannelData(ch);
			let i = 0;
			while (i < start && Math.abs(d[i]) < TH) i++;
			start = Math.min(start, i);
			let j = buffer.length - 1;
			while (j > end && Math.abs(d[j]) < TH) j--;
			end = Math.max(end, j);
		}
		return {
			buffer,
			offset: start / buffer.sampleRate,
			duration: Math.max(0, end + 1 - start) / buffer.sampleRate,
		};
	}

	async function loadAll() {
		if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
		await ctx.resume();
		await Promise.all(ALL.map(async src => {
			if (buffers.has(src)) return;
			const raw = await fetched.get(src);
			buffers.set(src, trim(await ctx.decodeAudioData(raw.slice(0))));
		}));
	}

	function pool() {
		return checks.filter(c => c.checked).flatMap(c => FILES[c.value]);
	}

	function pick() {
		const p = pool();
		if (p.length === 0) return null;
		const candidates = p.length > 1 ? p.filter(s => s !== lastSrc) : p;
		return candidates[Math.floor(Math.random() * candidates.length)];
	}

	function makeSource(src, when) {
		const { buffer, offset, duration } = buffers.get(src);
		const G = grid();
		const source = ctx.createBufferSource();
		source.buffer = buffer;
		source.loop = true;
		source.loopStart = offset;
		source.loopEnd = offset + duration;
		source.connect(ctx.destination);
		source.start(when, offset);
		source.stop(when + G);
		return { source, src, when, endTime: when + G };
	}

	// 次のサンプルを現在の終了時刻ちょうどに予約する
	function scheduleNext(when) {
		const src = pick();
		if (!src) { pending = null; return; }
		lastSrc = src;
		pending = makeSource(src, when);
	}

	// 現在のサンプルが終わった瞬間、予約済みが再生中になる
	function promote() {
		if (!playing) return;
		if (!pending) { stop(); return; }
		current = pending;
		pending = null;
		show(current.src);
		current.source.onended = promote;
		scheduleNext(current.endTime);
	}

	function show(src) {
		nowEl.innerHTML = '<span class="dot"></span>' + src.replace('audio/', '').replace('.m4a', '');
	}

	async function start() {
		if (pool().length === 0) { nowEl.textContent = 'チェックを入れてください'; return; }
		playBtn.disabled = true;
		nowEl.textContent = '読み込み中…';
		try {
			await loadAll();
		} catch (e) {
			nowEl.textContent = '読み込みに失敗しました';
			playBtn.disabled = false;
			return;
		}
		playing = true;
		stopBtn.disabled = false;
		const src = pick();
		lastSrc = src;
		current = makeSource(src, ctx.currentTime + 0.05);
		show(src);
		current.source.onended = promote;
		scheduleNext(current.endTime);
	}

	function stop(msg) {
		playing = false;
		for (const x of [current, pending]) {
			if (!x) continue;
			x.source.onended = null;
			try { x.source.stop(); } catch (e) {}
		}
		current = pending = null;
		if (ctx) ctx.suspend();
		playBtn.disabled = false;
		stopBtn.disabled = true;
		nowEl.textContent = msg || '';
	}

	// チェック/切替単位の変更は予約済みの次サンプルに即反映(開始前なら取り消して選び直す)
	function repick() {
		if (!playing || !ctx) return;
		if (pending && pending.when > ctx.currentTime + 0.05) {
			const when = pending.when;
			pending.source.onended = null;
			try { pending.source.stop(); } catch (e) {}
			pending = null;
			lastSrc = current ? current.src : null;
			scheduleNext(when);
		} else if (!pending && current && current.endTime > ctx.currentTime) {
			// 全チェックが外れて予約なしだった後、再度チェックされた場合
			scheduleNext(current.endTime);
		}
	}
	checks.forEach(c => c.addEventListener('change', repick));
	grids.forEach(g => g.addEventListener('change', repick));

	playBtn.addEventListener('click', start);
	stopBtn.addEventListener('click', () => stop());

	// 再生中に全チェックが外れたら、いま鳴っているサンプルの終わりで止まる
</script>
</body>
</html>
